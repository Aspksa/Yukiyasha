name: Fast CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Fast quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

  windows-launcher:
    name: Windows launcher
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Launcher diagnostics
        shell: cmd
        run: Yukiyasha.bat --check

  gate:
    name: PR Gate
    if: always()
    needs: [quality, windows-launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WINDOWS_RESULT: ${{ needs.windows-launcher.result }}
        run: |
          echo "Fast quality: $QUALITY_RESULT"
          echo "Windows launcher: $WINDOWS_RESULT"
          test "$QUALITY_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
