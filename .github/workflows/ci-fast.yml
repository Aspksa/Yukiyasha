name: Fast CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Fast quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: UI helper tests
        run: |
          node --check src/yukiyasha/web/static/ai.js
          node --check src/yukiyasha/web/static/schedule.js
          node --check src/yukiyasha/web/static/proposals.js
          node --check src/yukiyasha/web/static/documents.js
          node --test tests/js/*.test.js

      - name: Build wheel and verify packaged UI
        run: |
          python -m pip wheel --no-deps -w dist .
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert len(names) == len(set(names)), "duplicate files in wheel"
          for required in ("app.js", "util.js", "primavtodor.js", "schedule.js", "proposals.js", "documents.js", "ai.js", "index.html", "style.css"):
              assert f"yukiyasha/web/static/{required}" in names, required
          for data in (
              "modules/ai/character/yukiyasha_pack.json",
              "modules/primavtodor/forms/waybill_form3.xlsx",
              "modules/primavtodor/forms/fuel_card.xlsx",
              "modules/primavtodor/forms/fuel_report.xlsx",
              "modules/primavtodor/forms/timesheet_t12.xlsx",
              "modules/primavtodor/calendars/ru-2026.json",
              "modules/primavtodor/calendars/ru-2027.json",
          ):
              assert f"yukiyasha/{data}" in names, data
          PY

  windows-launcher:
    name: Windows launcher
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify launcher CRLF
        shell: pwsh
        run: |
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes("Yukiyasha.bat"))
          if ($text -match "(?<!\r)\n") {
            throw "Yukiyasha.bat must use CRLF line endings"
          }

      - name: Reject ambiguous leading-zero port
        shell: pwsh
        run: |
          $env:YUKIYASHA_PORT = "08080"
          $output = cmd /d /c "Yukiyasha.bat --check 2>&1"
          $exitCode = $LASTEXITCODE
          $text = $output -join [Environment]::NewLine
          if ($exitCode -eq 0) {
            throw "Leading-zero port was accepted"
          }
          if ($text -notmatch "Некорректный порт") {
            throw "Launcher failed for an unexpected reason. Output: $text"
          }
          exit 0

      - name: Verify code page restore parser
        shell: cmd
        run: |
          for /f "tokens=2 delims=:" %%C in ('chcp') do set "CP=%%C"
          powershell -NoProfile -Command "if(-not [int]::TryParse($env:CP.Trim(), [ref]([int]$n=0))){exit 1}; exit 0"

      - name: Launcher diagnostics
        shell: cmd
        run: Yukiyasha.bat --check

  gate:
    name: PR Gate
    if: always()
    needs: [quality, windows-launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WINDOWS_RESULT: ${{ needs.windows-launcher.result }}
        run: |
          echo "Fast quality: $QUALITY_RESULT"
          echo "Windows launcher: $WINDOWS_RESULT"
          test "$QUALITY_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
